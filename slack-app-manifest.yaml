display_information:
  name: RED Team Prop Threader
  description: Creates and indexes prop-request threads from ShotGrid pages.
features:
  bot_user:
    display_name: RED Team Prop Threader
    always_online: false
  slash_commands:
    - command: /create-prop-threads
      description: Create prop-request threads from a ShotGrid page
      usage_hint: "[ShotGrid page URL]"
      should_escape: false
    - command: /adopt-prop-threads
      description: Write official Slack thread links for ReviewPrep from this channel INDEX
      usage_hint: ""
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - channels:read
      - channels:history
      - chat:write
      - files:read
      - files:write
      - groups:read
      - groups:history
      - im:write
      - users:read
      - canvases:read
      - canvases:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
