[project]
name = "red-team-prop-threader"
dynamic = ["version"]
description = "Internal Slack app that creates and indexes prop-request threads from API-exportable ShotGrid pages."
readme = "README.md"
authors = [
    { name = "JerichoGreenPersonal", email = "67519931+JerichoGreenPersonal@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "flask>=3.1.3",
    "psycopg[binary]>=3.2",
    "shotgun-api3>=3.10.2",
    "slack-bolt>=1.30.0",
    "slack-sdk>=3.43.0",
    "sqlalchemy>=2.0",
    "waitress>=3.0.2",
]

[project.scripts]
prop-threader-web = "red_team_prop_threader.web:main"
prop-threader-worker = "red_team_prop_threader.worker:main"
prop-threader-retention = "red_team_prop_threader.retention:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "shotgrid_contract: live contract test requiring RUN_SHOTGRID_CONTRACT=1 and valid ShotGrid credentials",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]
