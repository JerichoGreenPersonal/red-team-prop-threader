[project]
name = "review-prep"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JerichoGreenPersonal", email = "67519931+JerichoGreenPersonal@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.0",
    "pyside6>=6.6",
    "shotgun-api3>=3.3.0",
]

[project.scripts]
review-prep = "review_prep:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.4",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]
